# Cash Shield rules v2: starting point for tuning on the TUNE2 set only.
# Base: the frozen v1 rules (rules.yaml, tag thresholds-frozen), plus S12-S14 for the
# red-team bypasses. S12-S14 weights are starting hypotheses, written before tuning
# and after holdout2 was frozen (tag holdout2-frozen). Never tuned on holdout2.
version: "v2-starting-hypotheses"

weights:
  S1: 30
  S2: 20
  S3: 15
  S4: 30
  S5: 15
  S6: 20
  S7: 20
  S8: 40
  S9: -15   # v2: only for a company registered at least legal_discount_min_age_days ago
  S10: 10
  S11: 20
  S12: 25   # loan or closed-deposit money leaves by transfer: >= s12_share of the balance in 24 h
  S13: 25   # drain over 7 days: >= s13_share of the 7-day-start balance, across more than one day
  S14: 25   # recipient company registered < s14_max_age_days ago

params:
  window_hours: 24
  balance_share_min: 0.8
  cash_large_min_kzt: 300000
  cash_large_median_mult: 5
  series_min_ops: 2
  series_min_total_kzt: 1000000
  new_payee_min_kzt: 200000
  phone_at_ear_min_sec: 3
  escalation_window_hours: 24
  legal_discount_min_age_days: 365
  s12_share: 0.6
  s13_share: 0.6
  s13_min_kzt: 1000000
  week_hours: 168
  s14_max_age_days: 180

thresholds:
  ask: 40
  pause: 55
  hold: 85

pause_minutes: 30
camera_enabled: true
