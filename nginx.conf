server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and WebSocket: the engine is never exposed directly, only through this proxy
  location /api/ {
    proxy_pass http://api:8000/;
    # This proxy plays the bank's terminal network: it adds the service token (filled in from
    # SERVICE_TOKEN when the container starts) and overwrites any token a browser sends.
    proxy_set_header X-Service-Token "${SERVICE_TOKEN}";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
}
